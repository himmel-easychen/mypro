spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  servlet:
    multipart:
      max-file-size: ${WORKPRO_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${WORKPRO_UPLOAD_MAX_REQUEST_SIZE:110MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aiagent}
    username: ${DB_USERNAME:aiagent}
    password: ${DB_PASSWORD:aiagent123}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
workpro:
  retrieval:
    rerank:
      enabled: ${WORKPRO_RERANK_ENABLED:false}
      base-url: ${WORKPRO_RERANK_BASE_URL:http://127.0.0.1:8000}
      path: ${WORKPRO_RERANK_PATH:/rerank}
      api-key: ${WORKPRO_RERANK_API_KEY:}
      model: ${WORKPRO_RERANK_MODEL:BAAI/bge-reranker-base}
  elasticsearch:
    url: ${WORKPRO_ELASTICSEARCH_URL:http://localhost:9200}
    index: ${WORKPRO_ELASTICSEARCH_INDEX:rag_chunks}
    username: ${WORKPRO_ELASTICSEARCH_USERNAME:}
    password: ${WORKPRO_ELASTICSEARCH_PASSWORD:}
    connect-timeout-ms: ${WORKPRO_ELASTICSEARCH_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${WORKPRO_ELASTICSEARCH_REQUEST_TIMEOUT_MS:15000}
  ocr:
    enabled: ${WORKPRO_OCR_ENABLED:true}
    base-url: ${WORKPRO_OCR_BASE_URL:http://127.0.0.1:8090}
    connect-timeout-ms: ${WORKPRO_OCR_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${WORKPRO_OCR_READ_TIMEOUT_MS:120000}
    max-file-bytes: ${WORKPRO_OCR_MAX_FILE_BYTES:104857600}
    minimum-page-pass-rate: ${WORKPRO_OCR_MINIMUM_PAGE_PASS_RATE:0.95}
    task-storage-dir: ${WORKPRO_OCR_TASK_STORAGE_DIR:${java.io.tmpdir}/workpro-ocr-tasks}
    redis:
      stream: ${WORKPRO_OCR_REDIS_STREAM:ocr-ingest}
      group: ${WORKPRO_OCR_REDIS_GROUP:ocr-workers}
      consumer: ${WORKPRO_OCR_REDIS_CONSUMER:worker-1}
      poll-delay-ms: ${WORKPRO_OCR_REDIS_POLL_DELAY_MS:1000}
  model:
    llm:
      provider: ${WORKPRO_LLM_PROVIDER:OpenAI}
      base-url: ${WORKPRO_LLM_BASE_URL:https://ahg.codes}
      api-key: ${WORKPRO_LLM_API_KEY:}
      model: ${WORKPRO_LLM_MODEL:gpt-5.6-sol}
      model_context_window : 1047576
      model_auto_compact_token_limit : 105197
      review_model : "gpt-5.5"
      model_reasoning_effort : "low"
      disable_response_storage : true
      network_access : "enabled"
      windows_wsl_setup_acknowledged : true
    rag-generation:
      # Use the same OpenAI-compatible dialogue endpoint by default. The RAG
      # generator remains independently configurable through these variables.
      provider: ${WORKPRO_RAG_GENERATION_PROVIDER:${WORKPRO_LLM_PROVIDER:OpenAI}}
      base-url: ${WORKPRO_RAG_GENERATION_BASE_URL:${WORKPRO_LLM_BASE_URL:https://ahg.codes}}
      api-key: ${WORKPRO_RAG_CHAT_API_KEY:${WORKPRO_LLM_API_KEY:}}
      model: ${WORKPRO_RAG_GENERATION_MODEL:${WORKPRO_LLM_MODEL:gpt-5.6-sol}}
      thinking: disabled
      max-tokens: ${WORKPRO_RAG_GENERATION_MAX_TOKENS:4096}
      connect-timeout-ms: ${WORKPRO_RAG_GENERATION_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${WORKPRO_RAG_GENERATION_READ_TIMEOUT_MS:180000}
      retries: ${WORKPRO_RAG_GENERATION_RETRIES:2}
    embedding:
      # 阿里云百炼 OpenAI 兼容模式；API Key 通过环境变量注入
      provider: ${WORKPRO_EMBEDDING_PROVIDER:dashscope}
      base-url: ${WORKPRO_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${WORKPRO_EMBEDDING_API_KEY:}
      model: ${WORKPRO_EMBEDDING_MODEL:qwen3.7-text-embedding}
      # 以首次 API 返回维度为最终准则
      dimension: ${WORKPRO_EMBEDDING_DIMENSION:1024}
